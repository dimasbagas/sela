[package]
name = "sela-app"
version = "0.3.0"
description = "Sela — notch interaktif: pil kecil di atas layar berisi musik, kalender, todo, pomodoro, cuaca, kurs, sholat, dan lirik."
authors = ["irul"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sela_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client untuk API publik gratis (Open-Meteo, Frankfurter, MyQuran, LRCLIB, Deezer).
# Tanpa API key. Dipakai rustls (bukan native-tls/OpenSSL): native-tls menggantung
# (timeout 20 dtk) ke lrclib.net & all.api.radio-browser.info lewat proxy egress
# MITM di VM ini, sementara rustls + curl + openssl CLI langsung OK (diuji
# 2026-11-21). rustls-native-roots memakai CA store sistem (+ SSL_CERT_FILE),
# jadi CA MITM proxy tetap dipercaya; system-proxy tetap aktif (env proxy).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "charset", "http2", "system-proxy"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
